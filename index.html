<style>

*{box-sizing:border-box}
body{margin:0;font-family:Segoe UI,Roboto,Arial,sans-serif;background:var(--fondo);color:var(--txt)}
header{background:var(--azul);color:#fff;padding:12px 16px;display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}

.estado{font-size:12px;padding:3px 8px;border-radius:12px;background:#ffffff22}

.tab{padding:11px 14px;color:#cfe0f5;cursor:pointer;white-space:nowrap;border-bottom:3px solid transparent;font-size:14px;user-select:none}
.tab.act{color:#fff;border-bottom-color:#ffd54f;background:#ffffff14;font-weight:600}
.tab .bd{display:inline-block;min-width:18px;padding:0 5px;border-radius:9px;background:var(--rojo);color:#fff;font-size:11px;margin-left:4px;text-align:center}
.tab.cd{background:#e65100;color:#fff;font-weight:700;border-right:2px solid #0f2a4a}

#banner{display:none;background:var(--rojo);color:#fff;padding:9px 16px;font-weight:600;cursor:pointer;animation:parp 1.2s infinite}
@keyframes parp{50%{background:#8e0000}}
@keyframes alarmaP{0%,100%{box-shadow:0 0 0 0 #e5393580}50%{box-shadow:0 0 0 6px #e5393500}}
.btnAlarma{display:inline-block;margin-left:6px;vertical-align:middle;background:#e53935;color:#fff;border:0;border-radius:6px;padding:2px 6px;font-size:10px;font-weight:700;cursor:pointer;animation:alarmaP 1.4s infinite;white-space:nowrap}
.btnAlarma:hover{background:#b71c1c}
.pzGrp>tr>td:first-child{border-left:1.5px solid #1f4e79!important}.tres:has(.pzGrp) tr:first-child>th:first-child{border-left:1.5px solid #1f4e79}.tres:has(.pzGrp) tr:first-child>th:last-child{border-right:1.5px solid #1f4e79}.tres:has(.pzGrp){border-collapse:collapse;border-spacing:0}.pzGrp>tr>td:last-child{border-right:1.5px solid #1f4e79!important}
.pzGrp>tr.gIni>td{border-top:1.5px solid #1f4e79!important}.pzGrp>tr.gFin>td,.pzGrp td.gRes{border-bottom:1.5px solid #1f4e79!important}

.campAl{display:inline-block;cursor:pointer;animation:campana 1.6s infinite;transform-origin:50% 10%}
.rsv{line-height:1.15;white-space:nowrap}.rsv b{font-size:12px}.rsv small{display:block;font-size:10px;color:var(--sub)}

details.despl[open]>summary::before{transform:rotate(90deg)}
details.despl>summary h3{margin:0}details.despl .cnt{font-weight:500;font-size:12px;color:var(--sub);margin-left:6px}
tr.sinReg td:not(.pz){background:#fff5f5}
#repCont.modoPdf .btnAlarma,#repCont.modoPdf .campAl{display:none}#repCont.modoPdf tr.sinReg td{background:#fff}
@media print{.btnAlarma,.campAl{display:none!important}tr.sinReg td{background:#fff!important}}
/* Reporte diario compacto */

#repCont .panel{padding:10px 12px;margin-top:10px}#repCont .panel h3{font-size:14px;margin-bottom:6px}
#repCont .kpis{gap:8px}#repCont .kpi{padding:7px 10px;border-top-width:3px}#repCont .kpi .kv{font-size:19px;margin:2px 0}#repCont .kpi .kt,#repCont .kpi .ks{font-size:11px}
#repCont .tres .gauge{height:16px!important;min-width:130px}#repCont .tres td{white-space:nowrap}

.nivelbox{border:1px solid var(--borde);border-radius:10px;padding:10px}

input[type=range]{-webkit-appearance:none;appearance:none;height:16px;border-radius:8px;padding:0;border:0;background:linear-gradient(to right,hsl(0,75%,45%),hsl(30,85%,48%),hsl(60,80%,45%),hsl(90,70%,40%),hsl(120,70%,35%))}

.acciones{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end;margin-top:14px}

.gridcd{grid-template-columns:repeat(auto-fit,minmax(270px,1fr));align-items:start}

.tqinfo .mat,.tqinfo .btn{white-space:nowrap}
.tqs{display:flex;flex-wrap:wrap;gap:10px;margin-top:10px}

.tqcuerpo span{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:800;color:#1b2533;text-shadow:0 0 3px #fff}

.ultr{font-size:10.5px;color:var(--sub)}
.tab.rs{background:#1565c0;color:#fff;font-weight:700}

.rsm{width:auto}
.rsm td,.rsm th{padding:4px 10px;line-height:1.25}

.rsmBox{width:fit-content;max-width:100%;margin-left:auto;margin-right:auto}
.tres tr.tot td{background:#1f4e79;color:#fff;font-weight:800}
.tab.rp{background:#6a1b9a;color:#fff;font-weight:700}
.tab.rp.act{background:#4a148c}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px}
.kpi{background:#fff;border:1px solid var(--borde);border-top:4px solid var(--azul2);border-radius:10px;padding:12px}
.kpi .kt{font-size:12px;color:var(--sub);font-weight:600}.kpi .kv{font-size:26px;font-weight:800;margin:4px 0}.kpi .ks{font-size:12px;color:var(--sub)}
.ngrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(380px,1fr));gap:16px}
.ngrupo{border:1px solid var(--borde);border-radius:10px;padding:12px}
.ntit{font-weight:800;margin-bottom:10px}.ntit span{color:var(--sub);font-weight:600}
.nbar{display:grid;grid-template-columns:minmax(150px,38%) 1fr;gap:10px;align-items:center;margin:7px 0}
.nlab{font-size:13px;font-weight:600}
.ntrack{position:relative;height:26px;background:#eceff3;border-radius:6px;overflow:hidden}
.nfill{height:100%;border-radius:6px 0 0 6px}
.nmark{position:absolute;top:0;bottom:0;border-left:1px dashed #9aa5b4}
.nval{position:absolute;left:8px;top:0;bottom:0;display:flex;align-items:center;font-size:12px;font-weight:800;color:#1b2533;text-shadow:0 0 3px #fff}
.nesc{display:flex;justify-content:space-between;font-size:10px;color:var(--sub);margin-left:calc(38% + 10px)}
.rephead{display:none;justify-content:space-between;align-items:center;border-bottom:3px solid var(--azul);padding:6px 0 10px;margin-bottom:12px}

.hm{display:flex;align-items:center;gap:6px}.hm input{width:100%;min-width:0}.hm span{font-size:13px;color:var(--sub);font-weight:600}
.gen.problema{border:2px solid var(--rojo);background:#fff1f1}

<body>
<header>
  <h1>⛽ Control de Generadores · Piazzas</h1>
  <div class="acc">
    <span class="estado" id="estado">Modo local</span>
    <button class="btn sm lt" id="usrBtn" title="Usuario de este equipo (clic para cambiar)" onclick="pedirUsuario(true)">👤 —</button>
    <button class="btn sm lt" onclick="verBitacora()">📜 Bitácora</button>
    <button class="btn sm lt" onclick="pedirNotif()">🔔 Notificaciones</button>
    <button class="btn sm lt" onclick="exportarRespaldo()">💾 Respaldo</button>
    <button class="btn sm lt" onclick="document.getElementById('impJson').click()">📂 Restaurar</button>
    <input type="file" id="impJson" accept=".json" style="display:none" onchange="importarRespaldo(this)">
  </div>
</header>
<div class="tabs" id="tabs"></div>
<div id="banner" onclick="mostrarAlarma(true)"></div>
<main id="main"></main>

<div class="ov" id="ov"><div class="md" id="md"></div></div>
<div class="ov" id="usrOv" style="z-index:80"><div class="md" style="max-width:420px">
  <h3>👤 ¿Quién usa este equipo?</h3>
  <p style="font-size:13px;color:var(--sub);margin:0 0 10px">Escriba su nombre. Quedará registrado en cada cambio que haga (crear, editar o borrar).</p>
  <div class="fm"><label class="full">Nombre y apellido *<input id="usrNom" maxlength="60" placeholder="Ej.: Ricardo Bohórquez" onkeydown="if(event.key==='Enter')guardarUsuario()"></label></div>
  <div class="err" id="usrErr"></div>
  <div class="acciones"><button class="btn sec" id="usrCancel" onclick="$('usrOv').classList.remove('on')">Cancelar</button><button class="btn" onclick="guardarUsuario()">Guardar</button></div>
</div></div>
<div class="ov alarma" id="alOv"><div class="md" id="alMd"></div></div>
<div class="ov" id="imgOv" onclick="this.classList.remove('on')"><img id="imgBig" alt="Ficha técnica"></div>
<div id="toast"></div>

<script>
/* ===== CONFIGURACIÓN FIREBASE (opcional) =====
   Si se deja vacío, la app guarda en este navegador (localStorage).
   Para sincronizar entre dispositivos, pegue aquí la configuración de su proyecto Firebase
   (Firestore + Autenticación anónima habilitada). */
const FIREBASE_CONFIG = {
  apiKey: "AIzaSyAbzJqZTVqo9WFyahp0EksdUOUfbY26Vao",
  authDomain: "generadores-piazza.firebaseapp.com",
  projectId: "generadores-piazza",
  storageBucket: "generadores-piazza.firebasestorage.app",
  messagingSenderId: "630646433129",

const dF = t => { const d=new Date(t); return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`; };
const dH = t => { const d=new Date(t); return `${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`; };
const tieneNivel = g => g.nivel!==undefined && g.nivel!==null && g.nivel!=='';
/* ===== Horómetro en horas y minutos =====
   Se guarda como "H:MM". Acepta también los valores anteriores "501.9" / "850.50" (horas.minutos). */
function horMin(v){
  if(v===undefined||v===null||v==='') return null;
  const s = String(v).trim(); let m = s.match(/^(\d+)\s*[:hH]\s*(\d{1,2})/);
  if(m) return +m[1]*60 + Math.min(59, +m[2]);
  m = s.match(/^(\d+)(?:[.,](\d+))?$/);
  if(m){ const f = m[2] ? +m[2] : 0; return +m[1]*60 + (f<60 ? f : Math.round(parseFloat('0.'+m[2])*60)); }
  return null;
}
const fmtHM = min => (min===null||min===undefined) ? '—' : `${Math.floor(min/60).toLocaleString('es-EC')} h ${String(Math.round(min%60)).padStart(2,'0')} min`;
const minChip = m => num(m)>0 ? `<span class="chip" style="background:#e3f2fd;color:#1565c0;font-weight:800">⏱ ${fmtHM(m)}</span>` : `<span style="color:var(--sub)">${fmtHM(m||0)}</span>`;
const fmtHor = v => fmtHM(horMin(v));
const horStr = min => `${Math.floor(min/60)}:${String(min%60).padStart(2,'0')}`;
function horInput(id, val, ph){
  const m = horMin(val);
  return `<div class="hm"><input id="${id}H" type="number" min="0" step="1" placeholder="${ph||'Horas'}" value="${m===null?'':Math.floor(m/60)}"><span>h</span>
    <input id="${id}M" type="number" min="0" max="59" step="1" placeholder="Min" value="${m===null?'':m%60}"><span>min</span></div>`;
}
/* Devuelve "H:MM", '' si está vacío, o null si los minutos no son válidos */
function leerHor(id){
  const h = $(id+'H').value.trim(), mi = $(id+'M').value.trim();
  if(h==='' && mi==='') return '';
  const H = parseInt(h||'0',10), M = parseInt(mi||'0',10);
  if(isNaN(H)||isNaN(M)||H<0||M<0||M>59) return null;
  return horStr(H*60+M);
}
/* Minutos de encendido de cada registro (diferencia con el horómetro del registro anterior) */
function usoRegistros(g){
  const out = {}; let prev = null;
  hist(g).forEach(r => { const m = horMin(r.horometro); if(m===null) return; if(prev!==null && m>=prev) out[r.id] = m-prev; prev = m; });
  return out;
}
function usoPorDia(g){
  const u = usoRegistros(g), d = {};
  hist(g).forEach(r => { if(u[r.id]!==undefined) d[r.fecha] = (d[r.fecha]||0) + u[r.id]; });
  return d;
}

const mants = g => (g.mant||[]).slice().sort((a,b)=>(b.fecha+b.hora).localeCompare(a.fecha+a.hora));

function problemas(g){
  const out = [];

const consumoMax = g => { const m = String(g.consumo||'').match(/\d+(?:[.,]\d+)?/g); return m ? Math.max(...m.slice(0,2).map(x=>num(x))) : 0; };

const obsDia = g => [...new Set((g.regDia||[]).map(r=>String(r.nota||'').trim()).filter(Boolean))].join(' · ');

function hist(g){
  return (g.historial||[]).map(r => r.id ? {...r} : {id:'h'+r.t, fecha:dF(r.t), hora:dH(r.t), nivel:r.nivel, nota:r.nota, t:r.t})

function recalc(g){
  const h = hist(g); g.historial = h; if(!h.length) return g;
  const ult = h[h.length-1]; g.nivel = num(ult.nivel); g.ultimoRegistro = ult.fecha+' '+ult.hora;
  ['horometro','aceite','bateria','refrigerante','estado'].forEach(k => {
    for(let i=h.length-1;i>=0;i--) if(h[i][k]!==undefined && h[i][k]!=='' && h[i][k]!==null){ g[k]=h[i][k]; break; }
  });
  return g;
}

function genAl(g, f){
  const h = hist(g).filter(r=>r.fecha<=f);
  const x = {...g, historial:h}; delete x.nivel; ['horometro','aceite','bateria','refrigerante','estado','ultimoRegistro'].forEach(k=>delete x[k]);
  if(h.length) recalc(x);
  x.regDia = h.filter(r=>r.fecha===f && !esCarga(r));
  return x;
}

  const cs = state.centros.slice().sort((a,b)=>a.nombre.localeCompare(b.nombre));

  return {f, gens, sal, rec, cs, nov,

async function pdfReporte(){
  const cont = $('repCont'); if(!cont) return;
  if(!window.html2canvas || !window.jspdf){ toast('No se pudo cargar el generador de PDF (revise la conexión a internet)'); return; }
  toast('Generando PDF…');
  cont.classList.add('modoPdf');
  const { jsPDF } = window.jspdf, doc = new jsPDF({orientation:'landscape', unit:'mm', format:'a4'});
  const PW = 297, PH = 210, M = 8, W = PW - 2*M;
  let y = M;
  const bloques = [...cont.children];
  const anchoPrev = cont.style.width; cont.style.width = '1400px'; const anchoPdf = Math.max(1400, cont.scrollWidth + 20); cont.style.width = anchoPdf + 'px';
  try{
    for(const el of bloques){
      const cv = await html2canvas(el, {scale:2, backgroundColor:'#ffffff', useCORS:true, windowWidth:anchoPdf});
      const ratio = W / cv.width, er = el.getBoundingClientRect(), k = cv.height / er.height;
      // puntos donde se puede cortar sin partir una fila o un cuadro
      const cortes = [...new Set([...el.querySelectorAll('tr, .centro, .kpi, .tq, h3')].map(x => Math.round((x.getBoundingClientRect().bottom - er.top) * k)))]
        .filter(c => c > 0 && c < cv.height).sort((x,z)=>x-z);
      let sy = 0;
      while(sy < cv.height){
        const disp = Math.floor((PH - M - y) / ratio);
        if(cv.height - sy <= disp){
          const h = cv.height - sy, c2 = document.createElement('canvas'); c2.width = cv.width; c2.height = h;
          c2.getContext('2d').drawImage(cv, 0, sy, cv.width, h, 0, 0, cv.width, h);
          doc.addImage(c2.toDataURL('image/jpeg', 0.92), 'JPEG', M, y, W, h*ratio); y += h*ratio + 3; break;
        }
        let corte = cortes.filter(c => c > sy && c <= sy + disp).pop();
        if(!corte){ if(y > M){ doc.addPage(); y = M; continue; } corte = sy + disp; }
        const h = corte - sy, c2 = document.createElement('canvas'); c2.width = cv.width; c2.height = h;
        c2.getContext('2d').drawImage(cv, 0, sy, cv.width, h, 0, 0, cv.width, h);
        doc.addImage(c2.toDataURL('image/jpeg', 0.92), 'JPEG', M, y, W, h*ratio);
        sy = corte; doc.addPage(); y = M;
      }
    }
    doc.save(`Reporte_Diario_Generadores_${repFecha||hoy()}.pdf`);
  }catch(e){ console.error(e); toast('Error al generar el PDF'); }
  finally{ cont.classList.remove('modoPdf'); cont.style.width = anchoPrev; }
}

function quitarFoto(){ fotoTmp=null; $('fPrev').innerHTML=''; }
function comprimir(file,max=1200,q=0.7){
  return new Promise((res,rej)=>{ const r=new FileReader(); r.onload=()=>{ const img=new Image(); img.onload=()=>{
    const s=Math.min(1,max/Math.max(img.width,img.height)), c=document.createElement('canvas');
    c.width=Math.round(img.width*s); c.height=Math.round(img.height*s);
    c.getContext('2d').drawImage(img,0,0,c.width,c.height); res(c.toDataURL('image/jpeg',q)); };
    img.onerror=rej; img.src=r.result; }; r.onerror=rej; r.readAsDataURL(file); });
}
async function cargarFoto(inp){
  if(!inp.files[0]) return;
  try{ fotoTmp = await comprimir(inp.files[0]);
    $('fPrev').innerHTML = `<img src="${fotoTmp}" onclick="verImg(this.src)"><button class="btn sm rojo" style="margin-top:6px" onclick="quitarFoto()">Quitar foto</button>`;
  }catch(e){ toast('No se pudo cargar la imagen'); }
}

    <label class="full">Observación<input id="rNota" value="${esc(r.nota||'')}" placeholder="Ej.: abastecido 20 gal, prueba en vacío, etc."></label>
  </div><div class="err" id="fErr"></div>
  <div class="acciones"><button class="btn sec" onclick="verGen('${gid}')">Cancelar</button><button class="btn verde" onclick="guardarReg('${gid}','${rid||''}')">💾 Guardar registro</button></div>`);
  onNivel();
}
function guardarReg(gid, rid){
  const g = Object.assign({}, state.generadores.find(x=>x.id===gid)), h = hist(g);
  const fecha = $('rFecha').value, hora = $('rHora').value, hor = leerHor('rHor');
  if(!fecha || !hora){ $('fErr').textContent='Ingrese fecha y hora.'; return; }
  if(hor===null){ $('fErr').textContent='Los minutos del horómetro deben estar entre 0 y 59.'; return; }
  const ant = h.filter(x => x.id!==rid && (x.fecha+x.hora) <= (fecha+hora) && horMin(x.horometro)!==null);
  const horAnt = ant.length ? horMin(ant[ant.length-1].horometro) : null;
  if(hor!=='' && horAnt!==null && horMin(hor) < horAnt && !confirm(`El horómetro (${fmtHor(hor)}) es menor que el registro anterior (${fmtHM(horAnt)}). ¿Guardar de todas formas?`)) return;
  const old = rid ? h.find(x=>x.id===rid) : null;
  const r = {id: rid||uid(), fecha, hora, nivel:+$('fNivel').value, horometro:hor, aceite:$('rAce').value, bateria:$('rBat').value,
    refrigerante:$('rRef').value, estado:$('rEst').value, responsable:$('rResp').value.trim(), nota:$('rNota').value.trim(), t: old ? (old.t||Date.now()) : Date.now()};
  const i = h.findIndex(x=>x.id===r.id); if(i>=0) h[i]=r; else h.push(r);
  g.historial = h; g.actualizado = Date.now(); recalc(g);
  put('generadores', g); render(); verGen(gid); revisarAlarma();
  toast(rid ? 'Registro modificado' : 'Registro diario guardado');
}
function borrarReg(gid, rid){
  if(!confirm('¿Borrar este registro del historial?')) return;
  const g = Object.assign({}, state.generadores.find(x=>x.id===gid));
  g.historial = hist(g).filter(x=>x.id!==rid); g.actualizado = Date.now(); recalc(g);
  put('generadores', g); render(); verGen(gid); revisarAlarma(); toast('Registro borrado');
}

let audioCtx=null, sonidoInt=null, posponerHasta=0, bajosPrev=new Set(), inicial=true;
function bajos(){ return state.generadores.filter(g => tieneNivel(g) && num(g.nivel)<UMBRAL).sort((a,b)=>num(a.nivel)-num(b.nivel)); }
function beep(){
  try{
    audioCtx = audioCtx || new (window.AudioContext||window.webkitAudioContext)();
    if(audioCtx.state==='suspended') audioCtx.resume();
    const o=audioCtx.createOscillator(), g=audioCtx.createGain(), t=audioCtx.currentTime;
    o.type='square'; o.frequency.setValueAtTime(880,t); o.frequency.setValueAtTime(620,t+.25);
    g.gain.value=.12; o.connect(g); g.connect(audioCtx.destination); o.start(t); o.stop(t+.5);
  }catch(e){}
  if(navigator.vibrate) navigator.vibrate(300);
}
function iniciarSonido(){ pararSonido(); beep(); sonidoInt=setInterval(beep,1300); }
function pararSonido(){ clearInterval(sonidoInt); sonidoInt=null; }
document.addEventListener('click', ()=>{ if(audioCtx && audioCtx.state==='suspended') audioCtx.resume(); });

function revisarAlarma(){
  const b = bajos(), ids = new Set(b.map(g=>g.id));
  const ban = $('banner');
  if(b.length){ ban.style.display='block'; ban.textContent=`⚠ ${b.length} generador(es) con combustible menor a 80% — Hay que abastecer. (clic para ver)`; }
  else { ban.style.display='none'; pararSonido(); $('alOv').classList.remove('on'); }
  const nuevos = b.filter(g => !bajosPrev.has(g.id));
  bajosPrev = ids;
  if(nuevos.length) mostrarAlarma(true);
}
function mostrarAlarma(forzar){
  const b = bajos(); if(!b.length) return;
  if(!forzar && $('alOv').classList.contains('on')) return;
  if(!forzar && Date.now()<posponerHasta) return;
  $('alMd').innerHTML = `<h3>🚨 ALERTA: ABASTECER COMBUSTIBLE</h3>
    <p>Los siguientes generadores llegaron <b>menos del 80%</b> de combustible:</p>
    <ul>${b.map(g=>`<li><b style="color:${color(g.nivel)}">${num(g.nivel)}%</b> — Piazza <b>${esc(g.piazza)}</b> · ${esc(g.ubicacion)} <span style="color:var(--sub);font-size:13px">(faltan ≈ ${fmt(num(g.capacidad)*(100-num(g.nivel))/100)} gal)</span></li>`).join('')}</ul>
    <div class="acciones"><button class="btn sec" onclick="posponer()">⏰ Recordar en 30 min</button><button class="btn rojo" onclick="cerrarAlarma()">Entendido</button></div>`;
  $('alOv').classList.add('on'); iniciarSonido();
  if('Notification' in window && Notification.permission==='granted'){
    try{ new Notification('⚠ Abastecer combustible', {body: b.map(g=>`${g.piazza} · ${g.ubicacion}: ${g.nivel}%`).join('\n'), requireInteraction:true}); }catch(e){}
  }
}
function cerrarAlarma(){ pararSonido(); $('alOv').classList.remove('on'); posponerHasta = Date.now()+30*60*1000; }
function posponer(){ cerrarAlarma(); toast('Se recordará en 30 minutos'); }
setInterval(()=>mostrarAlarma(false), 60*1000);

  if(!('Notification' in window)) return toast('Este navegador no admite notificaciones');

/* ===== Centro de Distribución (con tanques por material) ===== */
const MATERIALES = { 'Polietileno': {c:'#1e88e5', bg:'#e3f2fd', ic:'🛢'}, 'Metálico': {c:'#546e7a', bg:'#eceff1', ic:'⚙'} };
const tqs = c => Array.isArray(c.tanques) ? c.tanques : [];
const capCentro = c => tqs(c).length ? tqs(c).reduce((s,t)=>s+num(t.capacidad),0) : num(c.galones);
const sync = c => { if(tqs(c).length) c.galones = Math.round(tqs(c).reduce((s,t)=>s+num(t.galones),0)*100)/100; return c; };
/* Suma o resta galones en un tanque y recalcula el total del centro */
function ajustarTanque(c, tid, delta){
  c = {...c, tanques: tqs(c).map(t=>({...t}))};
  if(!c.tanques.length){ c.galones = Math.max(0, num(c.galones)+delta); return c; }
  const t = c.tanques.find(x=>x.id===tid) || c.tanques[0];
  t.galones = Math.max(0, Math.round((num(t.galones)+delta)*100)/100);
  return sync(c);
}
const ultRecarga = (cid, tid) => state.ingresos.filter(r=>r.centroId===cid && (!tid || r.tanqueId===tid)).sort((a,b)=>(b.fecha+b.hora).localeCompare(a.fecha+a.hora))[0];
/* Reparte una salida: primero el tanque elegido y lo que falte de los demás (en uso primero) */
function repartir(c, tidPref, gal){
  const t = tqs(c); if(!t.length) return num(c.galones) >= gal ? {c:ajustarTanque(c,'',-gal), partes:[]} : null;
  const orden = [t.find(x=>x.id===tidPref), ...t.filter(x=>x.id!==tidPref && x.enUso!==false), ...t.filter(x=>x.id!==tidPref && x.enUso===false)].filter(Boolean);
  let resto = gal, cc = c; const partes = [];
  for(const x of orden){ if(resto<=0) break; const tom = Math.min(num(x.galones), resto); if(tom>0){ partes.push({tanqueId:x.id, nombre:tqNombre(c,x), galones:Math.round(tom*100)/100}); cc = ajustarTanque(cc, x.id, -tom); resto = Math.round((resto-tom)*100)/100; } }
  return resto>0 ? null : {c:cc, partes};
}
/* Devuelve al centro los galones de una salida (respeta el reparto entre tanques) */
function revertirSalida(c, d){
  if(Array.isArray(d.reparto) && d.reparto.length) return d.reparto.reduce((cc,p)=>ajustarTanque(cc, p.tanqueId, num(p.galones)), c);
  return ajustarTanque(c, d.tanqueId, num(d.galones));
}
function prevReparto(){
  const box = $('dRep'); if(!box) return;
  const c = window._despCentro, gal = num($('dGal').value), tid = $('xTq') ? $('xTq').value : '';
  if(!c || !tqs(c).length || gal<=0){ box.innerHTML=''; return; }
  const r = repartir(c, tid, gal);
  if(!r){ box.innerHTML = `<span style="color:var(--rojo);font-weight:700">No alcanza: el centro solo tiene ${fmt(c.galones)} gal en total.</span>`; return; }
  box.innerHTML = r.partes.length>1 ? `⚠ El tanque elegido no alcanza, se descontará así: ${r.partes.map(p=>`<b>${esc(p.nombre.split(' · ')[0])}: ${fmt(p.galones)} gal</b>`).join(' + ')}` : `Se descontarán ${fmt(gal)} gal del ${esc(r.partes[0].nombre.split(' · ')[0])}`;
}
function tanqueHTML(t, i, cid){
  const u = ultRecarga(cid, t.id);
  const m = MATERIALES[t.material] || MATERIALES['Polietileno'], cap = num(t.capacidad), g = num(t.galones), pct = cap>0 ? Math.min(100, g/cap*100) : 0;
  return `<div class="tq ${t.enUso===false?'off':''}" style="--mc:${m.c};--mbg:${m.bg};cursor:pointer" title="Clic para ver detalle" onclick="verTanque('${cid}','${t.id}')">
    <div class="tqcuerpo"><div class="tqlleno" style="height:${pct}%;background:${color(pct)}"></div><span>${Math.round(pct)}%</span></div>
    <div class="tqinfo"><b>Tanque ${i+1}</b><span style="font-size:15px;font-weight:800">${fmt(g)} <span style="font-weight:500;font-size:12px;color:var(--sub)">/ ${fmt(cap)} gal</span></span>${t.enUso===false?'<span class="sinuso">Sin uso</span>':''}</div></div>`;
}
function canTot(c){
  const pz = pzC(c); if(!pz) return ''; const cn = canecasDe(pz); if(cn.n<=0) return '';
  return `<div style="font-size:12px;color:#6d4c41;font-weight:700">+ 🛢 ${cn.n} canecas (${fmt(cn.gal)} gal)</div>`;

function verTanque(cid, tid){
  const c = state.centros.find(x=>x.id===cid); if(!c) return;
  const ts = tqs(c), i = ts.findIndex(x=>x.id===tid), t = ts[i]; if(!t) return;
  const m = MATERIALES[t.material] || MATERIALES['Polietileno'], cap = num(t.capacidad), g = num(t.galones), pct = cap>0 ? Math.min(100, g/cap*100) : 0;

function genSinDespacho(g){

function nivelTrasCarga(g, gal, base){ const cap = num(g.capacidad); return cap>0 ? Math.min(100, Math.round((cap*base/100+gal)/cap*100)) : base; }

  if(g && $('dNivAnt').value!=='') $('dNivGal').textContent = `= ${fmt(num(g.capacidad)*num($('dNivAnt').value)/100)} gal de ${fmt(g.capacidad)}`; else $('dNivGal').textContent = '';

  const capTxt = `<div style="font-size:15px;margin-bottom:4px">🛢 Capacidad del tanque del generador: <b>${fmt(g.capacidad)} galones</b> (${fmt(num(g.capacidad)*GAL_L)} L)</div>`;
  const base = nivelBase(g);
  if(base===null){ box.innerHTML = capTxt + '<span style="color:#b7791f">Ingrese el nivel que tenía el generador antes de recargar para poder actualizarlo.</span>'; return; }
  const cap = num(g.capacidad), falt = cap - cap*base/100;
  if(!$('dAct').checked || gal<=0){ box.innerHTML = capTxt + `Nivel actual: <b style="color:${color(base)}">${base}%</b> · le faltan ${fmt(falt)} gal para llenarse`; return; }
  const n = nivelTrasCarga(g, gal, base);
  box.innerHTML = capTxt + `Generador: <b style="color:${color(base)}">${base}%</b> → <b style="color:${color(n)}">${n}%</b> (${fmt(Math.min(cap, cap*base/100+gal))} de ${fmt(cap)} gal)${gal>falt?` · <b style="color:var(--rojo)">sobran ${fmt(gal-falt)} gal, el tanque solo recibe ${fmt(falt)}</b>`:''}`;
}
function sigNumero(){

/* Quita del historial del generador el abastecimiento de una salida */
function quitarAbastecimiento(d){
  const g0 = d && d.generadorId && state.generadores.find(x=>x.id===d.generadorId);
  const ids = ['desp-'+d.id, 'desp-'+d.id+'-ini'];
  if(g0 && hist(g0).some(r=>ids.includes(r.id))){ const g = {...g0, historial: hist(g0).filter(r=>!ids.includes(r.id))}; if(!g.historial.length) delete g.nivel; else recalc(g); put('generadores', g); }
  state.reservas.filter(r=>(r.movs||[]).some(m=>m.id==='desp-'+d.id)).forEach(r0 => { const r = JSON.parse(JSON.stringify(r0)); r.movs = r.movs.filter(m=>m.id!=='desp-'+d.id); put('reservas', r); });
}
function guardarDespacho(cid, imprimir, did){
  const old = did ? state.despachos.find(x=>x.id===did) : null;
  const cBase = state.centros.find(x=>x.id===cid);
  if(!cBase){ $('fErr').textContent='El centro de distribución de esta salida ya no existe.'; return; }
  const c0 = old ? revertirSalida(cBase, old) : cBase;
  let dest = $('dDest').value; if(dest==='__o') dest=$('dOtro').value.trim();
  const gal = num($('dGal').value), tid = $('xTq') ? $('xTq').value : '', t = tqs(c0).find(x=>x.id===tid);
  const f = {despacha:$('dDesp').value.trim(), traslada:$('dTras').value.trim()};
  if(!dest || gal<=0 || !f.despacha || !f.traslada){ $('fErr').textContent='Complete destino, galones, quién despacha y quién traslada.'; return; }
  const rep = repartir(c0, tid, gal);
  if(!rep){ $('fErr').textContent=`No hay suficiente combustible en el centro. Disponible en total: ${fmt(c0.galones)} gal.`; return; }
  const gen = genActual(), act = gen && $('dAct').checked, base = gen ? nivelBase(gen) : null;
  if($('dGen') && !gen && !confirm(PIAZZAS.includes(dest) ? `No seleccionó un generador. Los ${fmt(gal)} gal se sumarán a la RESERVA de ${dest} (${fmt(gal/num(resDe(dest).galCaneca))} caneca(s) de ${fmt(resDe(dest).galCaneca)} gal). ¿Continuar?` : 'No seleccionó un generador. ¿Guardar la salida sin generador de destino?')) return;
  if(act && base===null){ $('fErr').textContent='Ingrese el nivel que tenía el generador antes de recargar, o desmarque "Actualizar automáticamente".'; return; }
  if(act){ const falt = num(gen.capacidad)*(100-base)/100; if(gal > falt && !confirm(`Los ${fmt(gal)} gal superan lo que le falta al generador (${fmt(falt)} gal). ¿Guardar igual? El nivel quedará en 100%.`)) return; }
  // revertir efectos de la salida anterior
  if(old) quitarAbastecimiento(old);
  const c = rep.c;
  const d = {...(old||{}), id:old?old.id:uid(), numero:old?old.numero:sigNumero(), centroId:cid, origen:c0.nombre, destino:dest, galones:gal, tanqueId:tid,
    reparto:rep.partes, tanque: rep.partes.length>1 ? rep.partes.map(p=>`${p.nombre.split(' · ')[0]} (${fmt(p.galones)} gal)`).join(' + ') : tqNombre(c0,t),
    generadorId:gen?gen.id:'', generador:genNombre(gen), nivelGenerador:'', nivelAntes:undefined,
    fecha:$('dFecha').value||hoy(), hora:$('dHora').value||ahora(), ...f,
    asistente:$('dAsis').value.trim(), liderEntrega:$('dLE').value.trim(), liderRecibe:$('dLR').value.trim(),
    saldoAntes:num(c0.galones), saldoDespues:num(c.galones), creado:old?old.creado:Date.now(), editado:old?Date.now():undefined};
  if(act){
    const g = {...state.generadores.find(x=>x.id===gen.id)}, h = hist(g), n = nivelTrasCarga(gen, gal, base);
    if(!tieneNivel(gen)) h.push({id:'desp-'+d.id+'-ini', fecha:d.fecha, hora:d.hora, nivel:base, horometro:'', responsable:d.liderRecibe||d.traslada, nota:`Nivel antes de recargar (salida ${d.numero})`, t:Date.now()-1});
    h.push({id:'desp-'+d.id, fecha:d.fecha, hora:d.hora, nivel:n, horometro:'', responsable:d.liderRecibe||d.traslada,
      nota:`Abastecido ${fmt(gal)} gal · Salida ${d.numero} desde ${d.origen}`, t:Date.now()});
    g.historial = h; g.actualizado = Date.now(); recalc(g); put('generadores', g);
    d.nivelGenerador = `${base}% → ${n}%`; d.nivelAntes = base;
  }
  if(!gen && PIAZZAS.includes(dest)){
    const r = JSON.parse(JSON.stringify(resDe(dest))); r.movs = r.movs||[];
    r.movs.push({id:'desp-'+d.id, tipo:'Ingreso', cantidad: Math.round(gal/num(r.galCaneca)*100)/100, galones:gal, fecha:d.fecha, hora:d.hora, generadorId:'', generador:'',
      responsable:d.liderRecibe||d.traslada, obs:`Salida ${d.numero} desde ${d.origen}`, despachoId:d.id, t:Date.now()});
    put('reservas', r); d.reserva = true;
  }
  put('despachos', d); put('centros', c);
  cerrar(); render(); revisarAlarma();
  toast(`Salida ${d.numero} ${old?'modificada':'registrada'}${d.nivelGenerador?' · generador '+d.nivelGenerador:''}${d.reserva?' · sumado a la reserva de '+d.destino:''}`);
  if(imprimir) imprimirDespacho(d.id);
}

const SEED_CD = [
  {id:'cd-ceibos', nombre:'Ceibos', piazza:'Ceibos', obs:'1 tanque metálico de 500 galones, 2 tanques de polietileno de 250 galones', tanques:[...T(1,'Metálico',500), ...T(2,'Polietileno',250)]},

].map(c => ({...c, galones:0, creado:Date.now(), tanques:c.tanques.map((t,i)=>({...t, id:c.id+'-t'+(i+1)}))}));
const SEED_CD_FLAG = 'seed_centros_v1';
function aplicarSeedCentros(){
  try{ if(localStorage.getItem(SEED_CD_FLAG)) return; }catch(e){}
  SEED_CD.forEach(x => { if(!state.centros.some(c=>c.id===x.id || c.nombre===x.nombre)) put('centros', x); });
  try{ localStorage.setItem(SEED_CD_FLAG,'1'); }catch(e){}
}
const SEED_RES = [{id:'res-ceibos', piazza:'Ceibos', galCaneca:5, movs:[{id:'seed-can-ceibos', tipo:'Conteo', cantidad:18, fecha:'2026-10-20', hora:'08:00', generadorId:'', generador:'', responsable:'', obs:'Conteo inicial', t:1}]}];
function aplicarSeedReservas(){
  try{ if(localStorage.getItem('seed_reservas_v1')) return; }catch(e){}
  SEED_RES.forEach(x => { if(!state.reservas.some(r=>r.id===x.id)) put('reservas', x); });
  try{ localStorage.setItem('seed_reservas_v1','1'); }catch(e){}
}
function aplicarSeedLocal(){
  try{ if(localStorage.getItem(SEED_FLAG)) return; }catch(e){}
  SEED.forEach(x => { if(!state.generadores.some(g=>g.id===x.id)) put('generadores', {...x, creado:Date.now(), historial:[]}); });
  try{ localStorage.setItem(SEED_FLAG,'1'); }catch(e){}
}
async function aplicarSeedFirebase(){
  for(const x of SEED_RES){ const d = await db.collection('reservas').doc(x.id).get(); if(!d.exists) await db.collection('reservas').doc(x.id).set(x); }
  const sc = await db.collection('centros').get();
  if(sc.empty) await Promise.all(SEED_CD.map(x => db.collection('centros').doc(x.id).set(x)));
  const snap = await db.collection('generadores').get();
  if(!snap.empty) return;
  await Promise.all(SEED.map(x => db.collection('generadores').doc(x.id).set({...x, creado:Date.now(), historial:[]})));
}
